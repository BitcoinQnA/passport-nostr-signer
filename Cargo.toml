[package]
name = "gui-app-nostr-signer"
version = "0.1.0"
edition = "2021"
authors = ["Foundation Devices, Inc. <hello@foundation.xyz>"]
license = "GPL-3.0-or-later"

[workspace]
exclude = [".foundation-sdk", "logic"]

[dependencies]
# KeyOS platform crates come from the project-local SDK mapping that the
# Foundation CLI creates automatically under .foundation-sdk/. No KeyOS source
# checkout, and no access to any private Foundation repo, is required to build.
log = "0.4"
log-server = { package = "xous-api-log", path = ".foundation-sdk/current/lib/keyos/xous/api/log" }
security = { path = ".foundation-sdk/current/lib/keyos/api/security" }
server = { path = ".foundation-sdk/current/lib/keyos/server" }
slint-keyos-platform = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/runtime" }
serde = { version = "1", features = ["derive"] }

# Cross-target utilities
async-trait = "0.1"
anyhow = "1"
bip39 = { version = "2.2", features = ["std"] }
getrandom = "=0.2.10"
hex = "0.4"
hmac = "0.12"
oneshot = "0.1"
serde_json = "1"
sha2 = "0.10"
simd-adler32 = "=0.3.7"
uuid = { version = "=1.10.0", features = ["v4"] }

# Nostr signer logic crates, vendored under ./logic (its own sub-workspace).
nostr-core = { path = "logic/nostr-core" }
keystore = { path = "logic/keystore" }
protocol = { path = "logic/protocol" }

# tokio + tokio-tungstenite power the WebSocket transport used by the
# hosted-mode simulator; both depend on mio which doesn't compile for
# Xous. Restrict them to host builds.
[target.'cfg(not(target_os = "xous"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-tungstenite = "0.21"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
dirs = "5"

[target.'cfg(target_os = "xous")'.dependencies]
xous = { path = ".foundation-sdk/current/lib/keyos/xous/xous-rs" }

[build-dependencies]
slint-keyos-platform-build = { path = ".foundation-sdk/current/lib/keyos/slint-keyos-platform/build", default-features = false }

[patch.crates-io]
# getrandom needs the KeyOS-provided xous backend on device.
getrandom = { path = ".foundation-sdk/current/lib/keyos/imports/getrandom" }
# Keep the complete Slint graph on the SDK's packaged Foundation fork.
slint = { path = ".foundation-sdk/current/lib/slint/api/rs/slint" }
slint-build = { path = ".foundation-sdk/current/lib/slint/api/rs/build" }
slint-macros = { path = ".foundation-sdk/current/lib/slint/api/rs/macros" }
i-slint-common = { path = ".foundation-sdk/current/lib/slint/internal/common" }
i-slint-compiler = { path = ".foundation-sdk/current/lib/slint/internal/compiler" }
i-slint-core = { path = ".foundation-sdk/current/lib/slint/internal/core" }
i-slint-core-macros = { path = ".foundation-sdk/current/lib/slint/internal/core-macros" }
i-slint-backend-selector = { path = ".foundation-sdk/current/lib/slint/internal/backends/selector" }
i-slint-renderer-software = { path = ".foundation-sdk/current/lib/slint/internal/renderers/software" }
const-field-offset = { path = ".foundation-sdk/current/lib/slint/helper_crates/const-field-offset" }
vtable = { path = ".foundation-sdk/current/lib/slint/helper_crates/vtable" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(keyos)'] }
